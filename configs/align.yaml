paths:
  experiment_root: results/example_experiment  # Directory containing samples/, tree_sampling or tree.
  samples_dir: null        # Optional override when samples live outside experiment_root.
  tree_path: null          # Override the pickled PyTree definition; defaults to tree|tree_sampling.
  output_dir: null         # Defaults to <experiment_root>/align/<timestamp>; set to reuse an existing folder.

architecture:
  family: mlp
  parameter_root: params.fcn  # Dot path to the dense layer subtree in the PyTree.

pipeline: [canonicalize, match]  # Stages to run, in order.
# Classification runs can insert the opt-in softmax-head translation stage
# (probability-preserving, logit-changing; never use for regression heads):
# pipeline: [canonicalize, center_softmax_head, match]
# center_softmax_head:
#   head: null             # Dot path to the head module (kernel [+ bias]); null auto-detects the unique head.

selection:
  chain_indices: null      # Only align these chains; leave empty to include every chain in samples/.
  samples_per_chain: null  # Cap how many samples to take from each chain (after stride filtering).
  sample_step: 1           # Keep every N-th sample inside each chain (1 == use all samples).
  max_total: null          # Optional global cap on the number of samples processed overall.
  reference_chain: 0       # Chain id that provides the reference sample before transforms.
  reference_sample: 0      # Sample id (index within chain) used as the reference parameters.

canonicalize:
  epsilon: 1e-8            # Numerical stabiliser for variance scaling.
  strategy: null          # Dense/conv canonical form: balanced (default; minimum-norm) or unit_norm (unit producer energy).
  degenerate_channels: preserve  # Alternatives: zero_outgoing, canonical_vector.
  include_bias_in_norm: true
  activation: relu

match:
  objective:
    type: euclidean       # Complete-graph objective over bound parameter tensors.
  # Geometry-aware alternative: diagonal Fisher-metric weight distance.
  # Weights are the diagonal Gauss-Newton Fisher at the reference sample,
  # precomputed with align.matching.fisher and stored as an npz keyed by
  # tensor id (see wiki/Matching-objectives-and-solvers.md):
  # objective:
  #   type: diagonal_fisher
  #   weights_path: results/example_experiment/fisher_weights.npz
  # Full activation-Gram relative-Fisher geometry is Sinkhorn-only:
  # objective:
  #   type: relative_fisher
  #   metrics_path: results/example_experiment/activation_grams.npz
  seed: 0                  # RNG seed ensures deterministic initialisation for stochastic solvers.
  barycenter_passes: 2     # 2 makes the canonical frame reference-independent. Drop to 1 past matching breakdown.
  solvers:
    - solver: lap          # Exact coordinate-descent LAP update when each group occurs at most once per tensor.
      max_sweeps: 25
      tolerance: 0.0
    # Mixed schedules can add Sinkhorn refinement and a final LAP polish:
    # - solver: sinkhorn
    #   tau: 0.1
    #   sinkhorn_iterations: 50
    #   learning_rate: 0.01
    #   max_steps: 200
    #   tolerance: 1.0e-05
    #   init_scale: 0.01
    #   record_loss_history: false
    #   record_ambiguity: false  # Entropy and assignment-margin diagnostics.
    # - solver: lap
    #   max_sweeps: 5
    #   tolerance: 0.0

runtime:
  # mps_async_dispatch: true # Optional Apple MPS dispatch policy; omit to inherit the plugin default.
  resume: false            # Reuse manifests/outputs inside output_dir and continue unfinished runs.
  dry_run: false           # Build manifests, validate configuration, and exit without aligning samples.
  list_samples: false      # Emit the manifest ordering to stdout and exit (debugging aid).
  describe_symmetry: false # Describe the weight-space symmetry of the reference sample and exit.
  validate_only: false     # Validate configuration + filesystem, then exit before running.
  force_cpu: false         # Leave false so Sinkhorn auto-selects GPUs; set true when benchmarking CPU-only.
  force_gpu: false         # Optional override to insist on GPUs even if JAX can't auto-detect them.
  parallelism: null        # null == auto based on the schedule and visible hardware.
  device_ids: null         # Explicit CUDA device ids in multi-GPU boxes; omit to consume every visible GPU.
  allow_device_sharing: false # Multiple workers per accelerator require this explicit unsafe override.
  max_worker_retries: 2    # Retry only transient process/heartbeat failures per sample.
  worker_threads: 1        # BLAS/OpenMP threads per worker process.
  per_device_batch: 1      # Use >1 for pure Sinkhorn schedules; LAP schedules process one sample at a time.
  verbosity: info          # Logging verbosity passed to the CLI (quiet/info/debug).
  validate_artifacts_on_resume: true  # Re-hash aligned sample/transform files before skipping them; false trusts checksums.
  save_intermediate: false # Persist intermediate outputs when chaining canonicalize and match.
