paths:
  experiment_root: results/example_mile_or_smile_run
  samples_dir: null
  tree_path: null
  output_dir: null
  sample_format: pytree_npz

architecture: dense_mlp
adapter:
  layer_root: params.fcn

selection:
  chain_indices: null
  samples_per_chain: null
  sample_step: 1
  max_total: null
  ref_chain: 0
  ref_sample: 0

normalize:
  enabled: true
  method: scale_normalize
  layer_root: params.fcn
  task_type: regression
  num_classes: null
  scale_normalize:
    epsilon: 1e-8
    degenerate_handling: preserve
    normalize_biases: true
    activation: relu
    activation_kwargs: {}
    classification_head_rescale: false

rebasin:
  enabled: true
  objective: l2_weight
  objective_kwargs: {}
  layer_root: params.fcn
  seed: 0
  schedule:
    - solver: lap
      max_sweeps: 25
      tol: 0.0

runtime:
  resume: false
  dry_run: false
  list_samples: false
  validate_only: false
  force_cpu: true
  force_gpu: false
  parallelism: null
  device_ids: null
  per_device_batch: 1
  verbosity: info
  validate_artifacts_on_resume: true
  save_intermediate: false
