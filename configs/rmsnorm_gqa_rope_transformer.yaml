# RMSNorm + RoPE + GQA transformer alignment example.
#
# The bundled samples are synthetic symmetry-copy chains generated by
# data/synthetic_rmsnorm_gqa_rope_transformer_samples/regenerate.py. The sampling
# package can also produce real posterior chains for this family. Inspect the symmetry:
#   uv run align configs/examples/rmsnorm_gqa_rope_transformer.yaml --describe-symmetry
#
# Symmetry model (wiki/Architecture-RMSNorm-GQA-RoPE-Transformer.md): a
# signed-permutation RMSNorm stream group, per-block GQA kv-group +
# query-head + signed vo groups, per-slot qk rotation_pairs groups (RoPE
# restricts the qk circuit to per-pair scaled rotations; matched by the
# closed-form rotation projection), and three exact diagonal scale families
# canonicalized by the RMSNorm/RoPE/GQA plan (signed RMSNorm gamma folding, qk
# pair and vo circuit balancing). `lap` routes kv groups through the structured
# two-level circuit-cost update and dispatches every group's update within its
# declared transform class automatically.
#
# For full orthogonal stream alignment (Procrustes), declare the stream class
# and append a procrustes step after the lap step:
#   architecture:
#     stream_transform_family: orthogonal
#   match:
#     solvers:
#       - solver: lap
#         max_sweeps: 25
#         tolerance: 0.0
#       - solver: procrustes
#         max_sweeps: 5
#         tolerance: 0.0

paths:
  experiment_root: /Users/manuel/Projects/align/data/synthetic_rmsnorm_gqa_rope_transformer_samples/synthetic_rmsnorm_gqa_rope_transformer_tiny
  samples_dir: null
  tree_path: null
  output_dir: null
  sample_format: pytree_npz

architecture:
  family: rmsnorm_gqa_rope_transformer
  parameter_root: ""  # blocks sit at the tree root

pipeline: [canonicalize, match]

selection:
  chain_indices: null
  samples_per_chain: null
  sample_step: 1
  max_total: null
  reference_chain: 0
  reference_sample: 0

canonicalize:
  # GELU FFN hidden units carry no scale symmetry; the plan touches only
  # RMSNorm gammas and the attention circuits.
  activation: gelu

match:
  objective:
    type: euclidean
  seed: 0
  barycenter_passes: 2
  solvers:
    - solver: lap
      max_sweeps: 25
      tolerance: 0.0

runtime:
  resume: false
  dry_run: false
  list_samples: false
  describe_symmetry: false
  validate_only: false
  force_cpu: true
  force_gpu: false
  parallelism: null
  device_ids: null
  allow_device_sharing: false
  max_worker_retries: 2
  worker_threads: 1
  per_device_batch: 1
  verbosity: info
  validate_artifacts_on_resume: true
  save_intermediate: false
