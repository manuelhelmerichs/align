# Modern transformer alignment example (RMSNorm + RoPE + GQA decoder).
#
# The bundled samples are synthetic symmetry-copy chains generated by
# data/synthetic_modern_transformer_samples/regenerate.py (bayesmates does not
# yet produce this architecture family). Inspect the block decomposition:
#   uv run align configs/examples/modern_transformer.yaml --list-problems
#
# Symmetry model (docs/theory.md, "Modern transformer families"): a
# signed-permutation RMSNorm stream group, per-block GQA kv-group +
# query-head + signed vo groups, per-slot qk rotation_pairs groups (RoPE
# restricts the qk circuit to per-pair scaled rotations; matched by the
# closed-form rotation projection), and three exact diagonal scale families
# canonicalized by the modern-transformer normalization plan (signed RMSNorm
# gamma folding, qk pair and vo circuit balancing). `lap` routes kv groups
# through the structured two-level circuit-cost update and dispatches every
# group's update within its declared transform class automatically.
#
# For full orthogonal stream alignment (Procrustes), declare the stream class
# and append a procrustes step after the lap step:
#   adapter:
#     stream_transforms: orthogonal
#   rebasin:
#     schedule:
#       - solver: lap
#         max_sweeps: 25
#         tol: 0.0
#       - solver: procrustes
#         max_sweeps: 5
#         tol: 0.0

paths:
  experiment_root: /Users/manuel/Projects/align/data/synthetic_modern_transformer_samples/synthetic_modern_transformer_tiny
  samples_dir: null
  tree_path: null
  output_dir: null
  sample_format: pytree_npz

architecture: modern_transformer
adapter:
  layer_root: ""  # blocks sit at the tree root

selection:
  chain_indices: null
  samples_per_chain: null
  sample_step: 1
  max_total: null
  ref_chain: 0
  ref_sample: 0

normalize:
  enabled: true
  method: scale_normalize
  scale_normalize:
    # GELU FFN hidden units carry no scale symmetry; the plan touches only
    # RMSNorm gammas and the attention circuits.
    activation: gelu

rebasin:
  enabled: true
  objective: l2_weight
  objective_kwargs: {}
  layer_root: null
  seed: 0
  refine_passes: 2
  schedule:
    - solver: lap
      max_sweeps: 25
      tol: 0.0

runtime:
  resume: false
  dry_run: false
  list_samples: false
  list_problems: false
  validate_only: false
  force_cpu: true
  force_gpu: false
  parallelism: null
  device_ids: null
  per_device_batch: 1
  verbosity: info
  validate_artifacts_on_resume: true
  save_intermediate: false
