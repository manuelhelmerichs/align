[project]
name = "align"
version = "0.1.0"
description = "Align posterior neural-network weight samples by canonicalizing scales and matching symmetry transforms."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jax==0.10.2",
    "flax==0.12.7",
    "numpy==2.5.1",
    "optax==0.2.8",
    "PyYAML==6.0.3",
    "scipy==1.18.0",
    "tqdm==4.68.4",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda13]==0.10.2",
]
mps = [
    "jax-mps==0.10.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "coverage==7.15.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[project.scripts]
align = "align.cli:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["align*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:JAXopt is no longer maintained\\.:DeprecationWarning",
]
markers = [
    "slow: marks tests that allocate large datasets (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
